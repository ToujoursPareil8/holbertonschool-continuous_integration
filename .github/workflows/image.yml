name: Build Docker Image

on:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t holbertonschool-continuous_integrations:latest .
  
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    permissions:
        contents: read
        packages: write
    steps:
        - name: Checckout Code
          uses: actions/checkout@v4

        - name: Log in to GHCR
          run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor}} --password-stdin

        - name: Build Image
          run : |
            docker-build \
                -t ghcr.io/${{ github.repository }}:latest \
                -t ghcr.io/${{ github.repository }}:${{ github.sha }} \
                .
        
        - name: Push image
          run: |
            docker push ghcrr.io/${{ github.repository }}:latest
            docker push ghcrr.io/${{ github.repository }}:${{ github.sha }}
              