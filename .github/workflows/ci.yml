name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Linter
        run: flake8 .

  test:
    name: Tests on python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: pytest
        
  deploy:        
    name: Deploy to Production
    runs-on: ubuntu-latest

    needs: lint

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Simulate secure Deployment
        env:
          API_TOKEN: ${{secrets.PRODUCTION_TOKEN}}
        run: |
          echo "Verification of prerequisites for deployment..."
          
          if [-z "$API_TOKEN"]; then
            echo "CRITICAL ERROR: The production token is missing or empty."
            exit 1
          else 
            echo "SUCCESS: Production token successfully injected into memory."
            echo "Deployment in progess..."
          fi