name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push
  push:
  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  lint:
    # dynamic job name 
    name: Checkout and Lint on python ${{matrix.python-version}}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Linter
        run: flake8 .


  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    needs: lint

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Simulate secure Deployment
        env:
          API_TOKEN: ${{secrets.PRODUCTION_TOKEN}}
        run: |
          echo "Verification of prerequisites for deployment..."
          
          if [-z "$API_TOKEN"]; then
            echo "CRITICAL ERROR: The production token is missing or empty."
            exit 1
          else 
            echo "SUCCESS: Production token successfully injected into memory."
            echo "Deployment in progess..."
          fi